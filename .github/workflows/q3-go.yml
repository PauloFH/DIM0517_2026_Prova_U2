name: Go

on:
  pull_request:
    types: [closed]
    branches:
      - develop

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: go build -o app ./src

      - name: Criar tag
        if: success()
        run: |
          TAG="build-${{ github.run_id }}"
          git tag "$TAG"
          git push origin "$TAG"

