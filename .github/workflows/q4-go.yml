name: Go

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: go build -o app ./src
      - name: Test
        run: go test -v ./...

      - name: Build da imagem Docker
        run: docker build -t api-go:${{ github.run_id }} .

      - name: Rodar a imagem Docker
        run: docker run -d --name api-go -p 8080:8080 api-go:${{ github.run_id }}

      - name: Verificar container
        run: |
          sleep 3
          docker ps
          curl -f http://localhost:8080/healthy
          curl -f http://localhost:8080/hello